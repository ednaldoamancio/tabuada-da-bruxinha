    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; }
        
        :root { 
            --hw-orange: #ff9900; 
            --neon-green: #39ff14; 
            --neon-red: #ff3131;
        }
        
        body { 
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #000; color: white; 
            overflow: hidden; 
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        
        #game-wrapper { 
            width: 100%; height: 100%; position: relative; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow: hidden;
        }

        #bg-video {
            position: absolute; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: 0; transform: translate(-50%, -50%);
            object-fit: cover;
            pointer-events: none;
        }

        .screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }

        .top-bar {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            display: flex; gap: 15px;
        }
        
        .icon-btn {
            background: rgba(0, 0, 0, 0.6); border: 2px solid var(--hw-orange); color: white;
            width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
            font-size: 24px; display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s;
        }
        .icon-btn:active { transform: scale(0.9); }

        .btn-dourado {
            background: linear-gradient(135deg, #f5b042, #ffd700);
            border: 2px solid #fff2b5;
            color: #3a2a1a;
            width: 50px; height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            animation: brilhoDourado 1.5s infinite alternate;
        }

        @keyframes brilhoDourado {
            0% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.4); }
            100% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.9); }
        }

        .menu-box {
            background: rgba(46, 2, 73, 0.95);
            border: 4px solid var(--hw-orange);
            padding: 25px; border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 153, 0, 0.5);
            text-align: center; max-width: 90%;
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        #ui { position: absolute; top: 8%; width: 100%; text-align: center; z-index: 20; pointer-events: none; }
        #question { font-size: 8vh; font-weight: bold; color: var(--hw-orange); text-shadow: 4px 4px #000; margin: 0; }
        
        .answer-box { 
            font-size: 6vh; width: 30vw; max-width: 250px; height: 9vh; line-height: 9vh;
            text-align: center; border-radius: 15px; border: 4px solid var(--hw-orange); 
            background: rgba(0,0,0,0.85); color: white; margin: 1vh auto;
            pointer-events: none;
        }
        
        .answer-reveal {
            color: var(--neon-red) !important;
            border-color: var(--neon-red) !important;
            animation: blink-neon 0.5s infinite alternate;
        }

        @keyframes blink-neon {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        #feedback { font-size: 4vh; font-weight: bold; height: 6vh; margin-top: 1vh; text-shadow: 2px 2px #000; }
        .stats { position: absolute; top: 20px; right: 20px; font-size: 3vh; background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px; z-index: 20; border: 1px solid var(--hw-orange); }

        #numpad {
            position: absolute; bottom: 5%; right: 5%;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            background: rgba(46, 2, 73, 0.8); padding: 12px; border-radius: 15px;
            border: 2px solid var(--hw-orange); backdrop-filter: blur(10px); z-index: 30;
        }
        .num-key {
            background: rgba(0,0,0,0.8); color: white; border: 2px solid var(--hw-orange);
            width: 7.5vh; height: 7.5vh; font-size: 3vh; border-radius: 10px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold;
        }
        .num-key:active { background: var(--hw-orange); color: black; transform: scale(0.9); }
        .num-key.enter { background: var(--neon-green); color: black; }

        #witch { 
            position: absolute; width: 22vh; bottom: 50%; left: 10%; 
            transition: bottom 0.5s ease-out; z-index: 15; filter: drop-shadow(4px 4px 8px black);
            pointer-events: none;
        }

        .btn { 
            background: var(--hw-orange); border: none; padding: 12px 30px; font-size: 2.2vh; 
            cursor: pointer; border-radius: 50px; margin: 8px; font-weight: bold; color: black; 
            box-shadow: 0 4px #cc7a00;
        }
        .btn:active { transform: scale(0.95); }
        
        .player-name-input {
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--neon-green);
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-size: 2vh;
            text-align: center;
            text-transform: uppercase;
            width: 80%;
            margin-bottom: 15px;
        }
        
        select {
            background: rgba(0,0,0,0.8);
            color: white;
            border: 2px solid var(--hw-orange);
            padding: 10px;
            border-radius: 10px;
            font-size: 2vh;
            width: 85%;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .ranking-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 1.8vh; }
        .ranking-table td, .ranking-table th { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .rank-pos { color: var(--hw-orange); font-weight: bold; }
        .rank-score { color: var(--neon-green); text-align: right; font-weight: bold; }
        
        #install-prompt {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #2e0249, #4b0082);
            border: 2px solid gold; border-radius: 50px; padding: 12px 24px;
            z-index: 400; font-size: 2vh; font-weight: bold; color: gold;
            backdrop-filter: blur(10px); cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <video autoplay muted loop playsinline id="bg-video">
        <source src="fundo_halloween.mp4" type="video/mp4">
    </video>

    <div class="top-bar">
        <div id="btn-voltar-dourado" class="btn-dourado" title="Voltar">⬅️</div>
        <div id="btn-audio" class="icon-btn" onclick="toggleAudio()">🔊</div>
        <div id="btn-full" class="icon-btn" onclick="toggleFullscreen()">⛶</div>
    </div>

    <!-- TELA DE MENU -->
    <div id="menu" class="screen">
        <div class="menu-box">
            <h1 style="color:var(--hw-orange); margin:0; font-size: 4vh;">🎃 Tabuada da Bruxinha 🎃</h1>
            <input type="text" id="player-name-input" class="player-name-input" placeholder="DIGITE SEU NOME" maxlength="12">
            <select id="tabuada-select"></select>
            <div style="margin: 15px 0; font-size: 2vh;">
                <label><input type="radio" name="ordem" value="seq" checked> Sequencial</label>
                <label style="margin-left:15px;"><input type="radio" name="ordem" value="rand"> Aleatória</label>
            </div>
            <button class="btn" id="btn-start">INICIAR</button>
            <button class="btn" id="btn-ranking" style="background:#4b0082; color:white;">🏆 RANKING</button>
        </div>
    </div>

    <!-- TELA DO JOGO -->
    <div id="game-container" class="screen" style="display:none;">
        <div class="stats">⭐ <span id="display-score">0</span></div>
        <div id="ui">
            <div id="question">--</div>
            <div id="answer-display" class="answer-box">?</div>
            <div id="feedback"></div>
        </div>
        <div id="numpad">
            <div class="num-key" data-num="7">7</div>
            <div class="num-key" data-num="8">8</div>
            <div class="num-key" data-num="9">9</div>
            <div class="num-key" data-num="4">4</div>
            <div class="num-key" data-num="5">5</div>
            <div class="num-key" data-num="6">6</div>
            <div class="num-key" data-num="1">1</div>
            <div class="num-key" data-num="2">2</div>
            <div class="num-key" data-num="3">3</div>
            <div class="num-key" data-num="0">0</div>
            <div class="num-key" data-num="DEL">←</div>
            <div class="num-key enter" data-num="ENTER">OK</div>
        </div>
        <img id="witch" src="bruxinha.gif" alt="Bruxinha">
    </div>

    <!-- MODAL RANKING -->
    <div id="modal-overlay" class="screen" style="display:none; background: rgba(0,0,0,0.95); z-index: 50;">
        <div class="menu-box">
            <h2 id="modal-title" style="font-size: 4vh;">🏆 RANKING</h2>
            <div id="stats-summary" style="display:none;">
                <p id="modal-details"></p>
                <div id="bonus-badge" style="display:none;">✨ BÓNUS MESTRE +5000 ✨</div>
                <div id="perfect-badge" style="display:none;">🎯 PERFEIÇÃO +1000 🎯</div>
            </div>
            <div id="highscore-area" style="display:none;">
                <p>Nome: <strong id="current-player-name-display"></strong></p>
                <button class="btn" id="save-score-btn">SALVAR RANKING</button>
            </div>
            <div id="ranking-area">
                <table class="ranking-table" id="ranking-table"></table>
                <br>
                <button class="btn" id="btn-back-menu">MENU PRINCIPAL</button>
            </div>
        </div>
    </div>
    
    <div id="install-prompt" class="hidden">📲 Instalar App ➕</div>
</div>

<script>
    // ==================== CONFIGURAÇÃO INICIAL ====================
    const opcoesTabuadas = [
        { value: "1", label: "Tabuada do 1" }, { value: "2", label: "Tabuada do 2" },
        { value: "3", label: "Tabuada do 3" }, { value: "4", label: "Tabuada do 4" },
        { value: "5", label: "Tabuada do 5" }, { value: "6", label: "Tabuada do 6" },
        { value: "7", label: "Tabuada do 7" }, { value: "8", label: "Tabuada do 8" },
        { value: "9", label: "Tabuada do 9" }, { value: "10", label: "Tabuada do 10" },
        { value: "11", label: "Tabuada do 11" }, { value: "12", label: "Tabuada do 12" },
        { value: "mista1", label: "Mista Fácil (x2)" }, { value: "mista2", label: "Mista Difícil (x8)" },
        { value: "master", label: "🏆 JORNADA MESTRE (x15)" }
    ];

    // Variáveis globais
    let currentPlayer = "";
    let audioEnabled = true;
    let gameActive = false;
    let gameData = {
        score: 0, questions: [], currentIndex: 0, multiplier: 1,
        isJornadaMaster: false, totalErrors: 0, currentAnswer: "",
        canAttempt: true, questionStartTime: 0, responseTimes: []
    };
    
    let bgMusic, sfxWin, sfxLose, sfxCrash, correctSounds, errorSounds;
    let witchY = 60, witchX = 10, witchDir = 1, physicsLoop = null;
    let finalScore = 0;

    // ==================== ÁUDIO ====================
    function initAudio() {
        bgMusic = new Audio('musica.mp3'); bgMusic.loop = true; bgMusic.volume = 0.5;
        sfxWin = new Audio('vitoria.mp3');
        sfxLose = new Audio('derrota.mp3');
        sfxCrash = new Audio('crash.mp3');
        correctSounds = ['beleza.mp3', 'muitobem.mp3', 'muitobom.mp3', 'sensacional.mp3', 'otimo.mp3'].map(s => new Audio(s));
        errorSounds = ['quepena.mp3', 'naofoi.mp3', 'praticando.mp3', 'tente.mp3'].map(s => new Audio(s));
    }
    
    function playRandomCorrectSound() {
        if (!audioEnabled) return;
        let s = correctSounds[Math.floor(Math.random() * correctSounds.length)];
        s.currentTime = 0; s.play().catch(e=>{});
    }
    
    function playRandomErrorSound() {
        if (!audioEnabled) return;
        let s = errorSounds[Math.floor(Math.random() * errorSounds.length)];
        s.currentTime = 0; s.play().catch(e=>{});
    }
    
    function toggleAudio() {
        audioEnabled = !audioEnabled;
        document.getElementById('btn-audio').innerText = audioEnabled ? "🔊" : "🔇";
        if(audioEnabled && gameActive) bgMusic.play().catch(e=>{});
        else bgMusic.pause();
    }

    // ==================== RANKING ====================
    function getRanking() {
        return JSON.parse(localStorage.getItem('ranking_bruxinha') || "[]");
    }
    
    function saveRanking(score) {
        let ranking = getRanking();
        let idx = ranking.findIndex(r => r.name === currentPlayer);
        if (idx !== -1) ranking[idx].score += score;
        else ranking.push({ name: currentPlayer, score: score });
        ranking.sort((a, b) => b.score - a.score);
        if (ranking.length > 15) ranking = ranking.slice(0, 15);
        localStorage.setItem('ranking_bruxinha', JSON.stringify(ranking));
    }
    
    function renderRanking() {
        const ranking = getRanking();
        const table = document.getElementById('ranking-table');
        if (!table) return;
        table.innerHTML = `<tr><th>#</th><th>NOME</th><th>PONTOS</th></tr>`;
        if (ranking.length === 0) {
            table.innerHTML += `<tr><td colspan="3" style="text-align:center;">✨ Sem jogadores ✨</td></tr>`;
        } else {
            ranking.forEach((r, i) => {
                table.innerHTML += `<tr><td class="rank-pos">${i+1}º</td><td>${r.name}</td><td class="rank-score">${r.score}</td></tr>`;
            });
        }
    }
    
    function showRanking() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('stats-summary').style.display = 'none';
        document.getElementById('highscore-area').style.display = 'none';
        document.getElementById('ranking-area').style.display = 'block';
        document.getElementById('modal-title').innerText = "🏆 RANKING";
        renderRanking();
    }

    // ==================== JOGO ====================
    function startGame() {
        const type = document.getElementById('tabuada-select').value;
        const isSeq = document.querySelector('input[name="ordem"]:checked').value === 'seq';
        
        gameData = {
            score: 0, questions: [], currentIndex: 0,
            multiplier: type === 'master' ? 15 : (type === 'mista2' ? 8 : (type === 'mista1' ? 2 : parseInt(type))),
            isJornadaMaster: type === 'master',
            totalErrors: 0, currentAnswer: "", canAttempt: true,
            questionStartTime: 0, responseTimes: []
        };
        
        let rawQuestions = [];
        if(type === 'master') {
            for(let i=0; i<20; i++) rawQuestions.push({ n1: Math.floor(Math.random()*13), n2: Math.floor(Math.random()*13), pointsEarned: false });
        } else if(!isNaN(type)) {
            let tab = parseInt(type);
            for(let i=0; i<=12; i++) rawQuestions.push({ n1: tab, n2: i, pointsEarned: false });
        } else {
            let start = type === 'mista1' ? 0 : 6;
            let end = type === 'mista1' ? 5 : 12;
            for(let i=start; i<=end; i++) {
                for(let j=0; j<=12; j++) rawQuestions.push({ n1: i, n2: j, pointsEarned: false });
            }
            if(!isSeq) rawQuestions.sort(() => Math.random() - 0.5);
            rawQuestions = rawQuestions.slice(0, 15);
        }
        if(!isSeq && type !== 'master') rawQuestions.sort(() => Math.random() - 0.5);
        
        gameData.questions = rawQuestions;
        gameActive = true;
        finalScore = 0;
        witchY = 60; witchX = 10; witchDir = 1;
        
        document.getElementById('witch').src = "bruxinha.gif";
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        document.getElementById('display-score').innerText = "0";
        
        if(audioEnabled) { bgMusic.currentTime = 0; bgMusic.play().catch(e=>{}); }
        
        startPhysics();
        showQuestion();
    }
    
    function showQuestion() {
        if(!gameActive) return;
        if(gameData.currentIndex >= gameData.questions.length) { finish(true); return; }
        const q = gameData.questions[gameData.currentIndex];
        document.getElementById('question').innerHTML = `${q.n1} x ${q.n2}`;
        document.getElementById('answer-display').innerHTML = "?";
        document.getElementById('answer-display').className = "answer-box";
        document.getElementById('feedback').innerHTML = "";
        gameData.currentAnswer = "";
        gameData.canAttempt = true;
        gameData.questionStartTime = Date.now();
    }
    
    function handleNumpad(val) {
        if(!gameActive || !gameData.canAttempt) return;
        
        if(val === 'DEL') {
            gameData.currentAnswer = gameData.currentAnswer.slice(0,-1);
            document.getElementById('answer-display').innerHTML = gameData.currentAnswer || "?";
            return;
        }
        
        if(val === 'ENTER') {
            checkAnswer();
            return;
        }
        
        if(gameData.currentAnswer.length < 4) {
            gameData.currentAnswer += val;
            document.getElementById('answer-display').innerHTML = gameData.currentAnswer;
        }
        
        const q = gameData.questions[gameData.currentIndex];
        const correct = q.n1 * q.n2;
        if (gameData.currentAnswer.length === String(correct).length) {
            checkAnswer();
        }
    }
    
    function checkAnswer() {
        if(!gameData.canAttempt || gameData.currentAnswer === "") return;
        const q = gameData.questions[gameData.currentIndex];
        const correct = q.n1 * q.n2;
        const timeSpent = Date.now() - gameData.questionStartTime;
        gameData.responseTimes.push(timeSpent);
        
        if(parseInt(gameData.currentAnswer) === correct) {
            playRandomCorrectSound();
            if(!q.pointsEarned) {
                let gain = 1 * gameData.multiplier;
                gameData.score += gain;
                document.getElementById('display-score').innerText = gameData.score;
                q.pointsEarned = true;
                document.getElementById('feedback').innerHTML = `MUITO BEM! ✨ +${gain}`;
            } else {
                document.getElementById('feedback').innerHTML = "CORRETO! (já pontuado)";
            }
            document.getElementById('feedback').style.color = "var(--neon-green)";
            witchY = Math.min(witchY + 10, 80);
            gameData.currentIndex++;
            gameData.canAttempt = false;
            setTimeout(() => showQuestion(), 800);
        } else {
            playRandomErrorSound();
            gameData.totalErrors++;
            document.getElementById('feedback').innerHTML = `OPS! ${q.n1} x ${q.n2} = ${correct}`;
            document.getElementById('feedback').style.color = "var(--neon-red)";
            const display = document.getElementById('answer-display');
            display.innerHTML = correct;
            display.classList.add('answer-reveal');
            witchY -= 5;
            document.getElementById('witch').src = "bruxinha-brava.gif";
            gameData.canAttempt = false;
            setTimeout(() => {
                display.classList.remove('answer-reveal');
                document.getElementById('witch').src = "bruxinha.gif";
                gameData.currentIndex++;
                showQuestion();
            }, 2000);
        }
    }
    
    function startPhysics() {
        if(physicsLoop) clearInterval(physicsLoop);
        physicsLoop = setInterval(() => {
            if(!gameActive) { clearInterval(physicsLoop); return; }
            witchX += (0.45 * witchDir);
            if(witchX > 85) { witchDir = -1; document.getElementById('witch').style.transform = "scaleX(-1)"; }
            else if (witchX < 5) { witchDir = 1; document.getElementById('witch').style.transform = "scaleX(1)"; }
            witchY -= 0.09;
            document.getElementById('witch').style.left = witchX + "%";
            document.getElementById('witch').style.bottom = witchY + "%";
            if(witchY < 5) { gameActive = false; handleCrash(); }
        }, 30);
    }
    
    function handleCrash() {
        if(physicsLoop) clearInterval(physicsLoop);
        bgMusic.pause();
        if(audioEnabled) sfxCrash.play().catch(e=>{});
        document.getElementById('witch').src = "bruxinha-caindo.gif";
        document.getElementById('feedback').innerHTML = "A bruxinha caiu!";
        setTimeout(() => finish(false), 2000);
    }
    
    function finish(success) {
        gameActive = false;
        if(physicsLoop) clearInterval(physicsLoop);
        let perfectBonus = 0, masterBonus = 0;
        
        if(success && gameData.totalErrors === 0 && !gameData.isJornadaMaster) {
            perfectBonus = 1000;
            if(audioEnabled) sfxWin.play().catch(e=>{});
        }
        if(success && gameData.isJornadaMaster && gameData.totalErrors === 0) {
            masterBonus = 5000;
            if(audioEnabled) sfxWin.play().catch(e=>{});
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, colors: ['#ffd700', '#ff9900'] });
        }
        
        finalScore = gameData.score + perfectBonus + masterBonus;
        
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('stats-summary').style.display = 'block';
        document.getElementById('highscore-area').style.display = 'block';
        document.getElementById('ranking-area').style.display = 'none';
        
        document.getElementById('perfect-badge').style.display = perfectBonus > 0 ? 'block' : 'none';
        document.getElementById('bonus-badge').style.display = masterBonus > 0 ? 'block' : 'none';
        document.getElementById('current-player-name-display').innerHTML = currentPlayer;
        
        let summary = `Pontuação: ${gameData.score}<br>`;
        if(perfectBonus > 0) summary += `🎯 Bônus Perfeição: +${perfectBonus}<br>`;
        if(masterBonus > 0) summary += `✨ Bônus Mestre: +${masterBonus}<br>`;
        summary += `<strong style="font-size:3vh;">Total: ${finalScore}</strong><br>`;
        summary += `Erros: ${gameData.totalErrors}`;
        document.getElementById('modal-details').innerHTML = summary;
        document.getElementById('modal-title').innerHTML = success ? "🎉 VITÓRIA! 🎉" : "💀 GAME OVER 💀";
        
        if(!success && audioEnabled) sfxLose.play().catch(e=>{});
    }
    
    function saveCurrentScore() {
        saveRanking(finalScore);
        document.getElementById('stats-summary').style.display = 'none';
        document.getElementById('highscore-area').style.display = 'none';
        document.getElementById('ranking-area').style.display = 'block';
        document.getElementById('modal-title').innerHTML = "🏆 RANKING";
        renderRanking();
    }
    
    function returnToMenu() {
        if(bgMusic) { bgMusic.pause(); bgMusic.currentTime = 0; }
        gameActive = false;
        if(physicsLoop) clearInterval(physicsLoop);
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('menu').style.display = 'flex';
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('player-name-input').value = currentPlayer;
    }
    
    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }
    
    function voltarPagina() {
        confetti({ particleCount: 80, spread: 70, colors: ['#ffd700', '#ffaa33'] });
        window.location.href = 'https://letramento-vogais.vercel.app/';
    }
    
    // ==================== EVENTOS E INICIALIZAÇÃO ====================
    window.onload = () => {
        initAudio();
        
        // Popular select
        const select = document.getElementById('tabuada-select');
        opcoesTabuadas.forEach(opt => {
            let option = document.createElement('option');
            option.value = opt.value;
            option.textContent = opt.label;
            select.appendChild(option);
        });
        
        // Eventos dos botões
        document.getElementById('btn-start').onclick = () => {
            let nome = document.getElementById('player-name-input').value.trim().toUpperCase();
            if(nome === "") { alert("Digite seu nome!"); return; }
            currentPlayer = nome;
            startGame();
        };
        
        document.getElementById('btn-ranking').onclick = () => showRanking();
        document.getElementById('btn-back-menu').onclick = () => returnToMenu();
        document.getElementById('save-score-btn').onclick = () => saveCurrentScore();
        document.getElementById('btn-voltar-dourado').onclick = () => voltarPagina();
        
        // Teclado numérico
        document.querySelectorAll('.num-key').forEach(btn => {
            btn.onclick = () => handleNumpad(btn.getAttribute('data-num'));
        });
        
        // Teclado físico
        document.addEventListener('keydown', (e) => {
            const gameVisible = document.getElementById('game-container').style.display === 'flex';
            if(gameVisible && gameActive) {
                if(e.key >= '0' && e.key <= '9') { handleNumpad(e.key); e.preventDefault(); }
                else if(e.key === 'Enter') { handleNumpad('ENTER'); e.preventDefault(); }
                else if(e.key === 'Backspace') { handleNumpad('DEL'); e.preventDefault(); }
            }
        });
        
        // PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(e => console.log("SW error:", e));
        }
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('install-prompt');
            installBtn.classList.remove('hidden');
            installBtn.onclick = () => {
                installBtn.classList.add('hidden');
                deferredPrompt.prompt();
            };
        });
    };
</script>
